<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <g class="autolar-rays" stroke="#f2b944" stroke-linecap="round" stroke-width="2">
    <path d="M20 2.5v3.2M20 24.3v3.2M7.8 14.9H11m18 0h3.2M11.4 6.3l2.3 2.3m12.6 12.6 2.3 2.3m0-17.2-2.3 2.3M13.7 21.2l-2.3 2.3"/>
  </g>
  <circle class="autolar-sun-core" cx="20" cy="15" r="6.1" fill="#ffd76a" stroke="#d79a2c" stroke-width="1.4"/>
  <path class="autolar-panel" d="m8 22.8 23.5.1-3.1 11H11.2L8 22.8Z" fill="#173c30" stroke="#82bd71" stroke-width="1.4" stroke-linejoin="round"/>
  <path class="autolar-panel-grid" d="m15.8 23 .3 10.9m7.7-10.9-.3 10.9M9.2 27h21m-19.8 3.5h18.8" stroke="#8fd18a" stroke-opacity=".82" stroke-width=".8"/>
  <style>
    .autolar-rays { transform-box: fill-box; transform-origin: 20px 15px; animation: rays-turn 18s linear infinite; }
    .autolar-sun-core { transform-box: fill-box; transform-origin: center; animation: sun-glow 3.4s ease-in-out infinite alternate; }
    .autolar-panel { transform-box: fill-box; transform-origin: center top; animation: panel-track 5s ease-in-out infinite alternate; }
    @keyframes rays-turn { to { transform: rotate(360deg); } }
    @keyframes sun-glow { from { opacity: .88; } to { opacity: 1; } }
    @keyframes panel-track { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
    @media (prefers-reduced-motion: reduce) { .autolar-rays, .autolar-sun-core, .autolar-panel { animation: none; } }
  </style>
</svg>
